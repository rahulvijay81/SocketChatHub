<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>no work people only — Group Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0b0d15;
  --panel: rgba(20, 22, 34, 0.55);
  --text: #eef0f7;
  --muted: #8b8fa3;
  --faint: #6b6f83;
  --glass: rgba(255, 255, 255, 0.06);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.08);
  --blue: #4f7cff;
  --purple: #9b5cff;
  --accent: linear-gradient(135deg, #4f7cff 0%, #9b5cff 100%);
  --green: #34d399;
  --danger: #f87171;
  --radius-lg: 20px;
  --radius-md: 16px;
  --shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
.hidden { display: none !important; }

html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Ambient background */
.bg-orbs {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
}
.bg-orbs::before, .bg-orbs::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.55;
}
.bg-orbs::before {
  width: 640px; height: 640px; top: -180px; left: -120px;
  background: radial-gradient(circle, #2b4bff, transparent 65%);
  animation: drift 22s ease-in-out infinite alternate;
}
.bg-orbs::after {
  width: 560px; height: 560px; bottom: -200px; right: -140px;
  background: radial-gradient(circle, #8b2fff, transparent 65%);
  animation: drift 26s ease-in-out infinite alternate-reverse;
}
@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(60px, 40px, 0) scale(1.12); }
}
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
  pointer-events: none;
}

/* ---------- Join screen ---------- */
.join-screen {
  position: relative; z-index: 1;
  width: min(440px, 92vw);
  padding: 44px 40px;
  border-radius: var(--radius-lg);
  background: var(--panel);
  backdrop-filter: blur(28px) saturate(140%);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
  text-align: center;
  animation: panelIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.join-screen .logo {
  width: 72px; height: 72px;
  margin: 0 auto 18px;
  border-radius: 22px;
  background: var(--accent);
  display: grid; place-items: center;
  font-size: 34px;
  box-shadow: 0 14px 34px -8px rgba(120, 90, 255, 0.6), inset 0 1px 0 rgba(255,255,255,0.35);
}
.join-screen h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.join-screen p { color: var(--muted); font-size: 14px; margin-top: 6px; }
.join-screen .status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500;
  margin-top: 18px; padding: 7px 14px; border-radius: 99px;
  background: var(--glass); border: 1px solid var(--border);
}
.join-screen .status i { width: 8px; height: 8px; border-radius: 50%; }
.status-connecting i { background: #fbbf24; }
.status-online i { background: var(--green); box-shadow: 0 0 0 3px rgba(52,211,153,0.18); }
.status-offline i { background: var(--danger); }
.join-form { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
.join-form input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 14px;
  background: var(--glass);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit; font-size: 15px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.join-form input::placeholder { color: var(--faint); }
.join-form input:focus {
  border-color: rgba(155,92,255,0.6);
  box-shadow: 0 0 0 4px rgba(155,92,255,0.14);
  background: var(--glass-strong);
}
.join-form button {
  width: 100%; padding: 14px;
  border: none; border-radius: 14px;
  background: var(--accent); color: #fff;
  font-family: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 12px 26px -8px rgba(120,90,255,0.6), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.join-form button:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(120,90,255,0.75); }
.join-form button:active { transform: scale(0.97); }

/* ---------- Chat screen ---------- */
.app {
  position: relative; z-index: 1;
  width: min(1120px, 96vw);
  height: min(760px, 92vh);
  height: min(760px, 92dvh);
  min-height: 0;
  display: flex; flex-direction: column;
}
.chat-panel {
  flex: 1; display: flex; flex-direction: column;
  border-radius: var(--radius-lg);
  background: var(--panel);
  backdrop-filter: blur(28px) saturate(140%);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
  overflow: hidden;
  animation: panelIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes panelIn {
  from { opacity: 0; transform: translateY(16px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Header */
header {
  display: flex; align-items: center; gap: 14px;
  flex: none;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
}
.group-avatar {
  position: relative; width: 46px; height: 46px; flex: none;
  border-radius: 15px; background: var(--accent);
  display: grid; place-items: center; font-size: 22px;
  box-shadow: 0 8px 20px -6px rgba(120,90,255,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
}
.group-avatar::after {
  content: ''; position: absolute; right: -2px; bottom: -2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--green); border: 3px solid #161822;
}
.group-meta { min-width: 0; }
.group-meta h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
.group-meta .subtitle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.group-meta .subtitle .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 0 3px rgba(52,211,153,0.18); }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--glass);
  color: var(--muted); cursor: pointer; display: grid; place-items: center;
  font-size: 16px; transition: all 0.2s ease;
}
.icon-btn:hover { color: var(--text); background: var(--glass-strong); transform: translateY(-1px); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; }

/* Messages */
.messages {
  flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 24px 26px 12px;
  scroll-behavior: smooth; display: flex; flex-direction: column; gap: 4px;
}
.messages::-webkit-scrollbar { width: 10px; }
.messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
.messages::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,0.16); }

.date-divider {
  align-self: center; font-size: 12px; color: var(--faint); font-weight: 500;
  padding: 6px 14px; border-radius: 99px; background: rgba(255,255,255,0.04);
  border: 1px solid var(--border); margin: 4px 0 18px;
}

.system-msg {
  align-self: center; font-size: 12.5px; color: var(--muted); font-weight: 500;
  padding: 6px 16px; border-radius: 99px;
  background: rgba(155, 92, 255, 0.08);
  border: 1px solid rgba(155, 92, 255, 0.2);
  margin: 8px 0; text-align: center;
  animation: msgIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
}

.msg {
  display: flex; gap: 12px; padding: 4px 10px; border-radius: var(--radius-md);
  position: relative; animation: msgIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.avatar {
  position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #fff;
  box-shadow: 0 6px 16px -6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
}
.avatar .status { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2.5px solid #14161f; }
.a-0 { background: linear-gradient(135deg, #3b82f6, #6366f1); }
.a-1 { background: linear-gradient(135deg, #ec4899, #8b5cf6); }
.a-2 { background: linear-gradient(135deg, #14b8a6, #3b82f6); }
.a-3 { background: linear-gradient(135deg, #f59e0b, #ec4899); }
.a-4 { background: linear-gradient(135deg, #10b981, #14b8a6); }
.a-5 { background: linear-gradient(135deg, #f97316, #ef4444); }
.a-6 { background: linear-gradient(135deg, #06b6d4, #3b82f6); }

.msg-body { min-width: 0; max-width: calc(100% - 52px); display: flex; flex-direction: column; }
.msg.msg-self .msg-body { align-items: flex-end; }
.msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.msg-head .name { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; }
.msg-head .time { font-size: 12px; color: var(--faint); font-weight: 400; }
.msg-head .edited { font-size: 11px; color: var(--faint); font-style: italic; }

.bubble {
  display: inline-block; max-width: 100%; padding: 10px 15px;
  border-radius: 18px 18px 18px 4px;
  font-size: 14.5px; line-height: 1.5; word-break: break-word;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px -6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}

.reactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.reaction {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px;
  padding: 4px 9px; border-radius: 99px; background: var(--glass); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.18s ease; user-select: none;
}
.reaction:hover { background: var(--glass-strong); border-color: rgba(155,92,255,0.5); transform: translateY(-1px); }
.reaction .count { font-weight: 600; color: var(--muted); font-size: 12px; }
.reaction.active { background: rgba(155,92,255,0.18); border-color: rgba(155,92,255,0.55); }
.reaction.active .count { color: #c8b0ff; }
.reaction.bounce { animation: bounce 0.5s ease; }
@keyframes bounce {
  0% { transform: scale(1); } 35% { transform: scale(1.35); } 70% { transform: scale(0.92); } 100% { transform: scale(1); }
}

.hover-actions {
  position: absolute; top: 8px; right: 12px; display: flex; gap: 4px;
  opacity: 0; transform: translateY(4px); transition: opacity 0.18s ease, transform 0.18s ease; pointer-events: none;
}
.msg:hover .hover-actions { opacity: 1; transform: translateY(0); pointer-events: auto; }
.hover-actions button {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border);
  background: rgba(20,22,34,0.85); backdrop-filter: blur(6px); color: var(--muted);
  cursor: pointer; display: grid; place-items: center; font-size: 13px; transition: all 0.16s ease;
}
.hover-actions button:hover { color: var(--text); background: var(--glass-strong); transform: translateY(-1px); }
.hover-actions button svg { width: 15px; height: 15px; stroke: currentColor; }

.typing {
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  flex: none;
  padding: 8px 10px; margin-top: 4px; opacity: 0; visibility: hidden; transition: opacity 0.2s ease;
}
.typing.active { opacity: 1; visibility: visible; }
.typing .typing-dots { display: inline-flex; gap: 4px; }
.typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: typing 1.2s infinite ease-in-out; }
.typing-dots i:nth-child(2) { animation-delay: 0.15s; }
.typing-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Composer */
.composer-wrap { flex: none; padding: 16px 22px 20px; border-top: 1px solid var(--border); background: linear-gradient(0deg, rgba(255,255,255,0.03), transparent); }
.composer { display: flex; align-items: center; gap: 10px; position: relative; }
.input-shell {
  flex: 1; display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 6px 16px; border-radius: var(--radius-md);
  background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(10px);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.input-shell:focus-within {
  border-color: rgba(155,92,255,0.6); box-shadow: 0 0 0 4px rgba(155,92,255,0.14);
  background: var(--glass-strong);
}
.input-shell input {
  flex: 1; background: transparent; border: none; outline: none; color: var(--text);
  font-family: inherit; font-size: 15px; padding: 10px 0;
}
.input-shell input::placeholder { color: var(--faint); }
.emoji-trigger {
  width: 36px; height: 36px; flex: none; border-radius: 10px; border: none;
  background: transparent; cursor: pointer; font-size: 18px; display: grid; place-items: center;
  transition: background 0.16s ease, transform 0.16s ease;
}
.emoji-trigger:hover { background: var(--glass-strong); transform: scale(1.08); }

.send-btn {
  position: relative; overflow: hidden; width: 48px; height: 48px; flex: none;
  border: none; border-radius: 15px; background: var(--accent); color: #fff; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 10px 24px -8px rgba(120,90,255,0.7), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.send-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -8px rgba(120,90,255,0.8); }
.send-btn:active { transform: scale(0.94); }
.send-btn svg { width: 20px; height: 20px; stroke: currentColor; }
.ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.5); transform: scale(0); animation: ripple 0.6s ease-out; pointer-events: none; }
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

/* Emoji picker popover */
.emoji-panel {
  position: absolute; bottom: 58px; left: 0; z-index: 10;
  width: 300px; max-height: 220px; overflow-y: auto;
  padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
  background: rgba(20,22,34,0.9); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
}
.emoji-panel button {
  aspect-ratio: 1; font-size: 20px; border: none; background: transparent;
  border-radius: 8px; cursor: pointer; transition: background 0.14s ease;
}
.emoji-panel button:hover { background: var(--glass-strong); }
/* Self messages — right aligned */
.msg.msg-self {
  flex-direction: row-reverse;
}
.msg.msg-self .msg-head {
  flex-direction: row-reverse;
}
.msg.msg-self .bubble {
  border-radius: 18px 18px 4px 18px;
  background: rgba(79, 124, 255, 0.2);
  border-color: rgba(79, 124, 255, 0.3);
}
.msg.msg-self .reactions {
  justify-content: flex-end;
}
.msg.msg-self .hover-actions {
  left: 12px;
  right: auto;
}

/* Mention dropdown */
.mention-dropdown {
  position: absolute; bottom: 58px; left: 0; z-index: 20;
  min-width: 200px; max-height: 220px; overflow-y: auto;
  background: rgba(20,22,34,0.95); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); padding: 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.mention-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px; cursor: pointer;
  transition: background 0.15s ease;
}
.mention-item:hover, .mention-item.mention-active {
  background: var(--glass-strong);
}
.mention-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 10px -4px rgba(0,0,0,0.5);
}
.mention-name { font-size: 14px; font-weight: 500; color: var(--text); }

/* Reply bar above composer */
.reply-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; margin-bottom: 8px;
  background: var(--glass); border: 1px solid var(--border);
  border-radius: 12px; gap: 10px;
}
.reply-bar-content {
  display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;
  color: var(--muted);
}
.reply-bar-content svg { flex: none; stroke: var(--purple); }
.reply-bar-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.reply-bar-name { font-size: 12px; font-weight: 600; color: var(--purple); }
.reply-bar-msg {
  font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px;
}
.reply-bar-close {
  flex: none; background: none; border: none; color: var(--faint);
  cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px;
  transition: color 0.15s, background 0.15s;
}
.reply-bar-close:hover { color: var(--text); background: var(--glass-strong); }

/* Reply quote inside bubble */
.reply-quote {
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px 10px; margin-bottom: 6px;
  border-left: 3px solid var(--purple);
  border-radius: 6px; background: rgba(255,255,255,0.05);
}
.reply-quote-name { font-size: 11px; font-weight: 600; color: var(--purple); }
.reply-quote-text {
  font-size: 12.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;
}

/* @mention — plain bold text, no chip */
.mention-chip {
  font-weight: 600;
  color: var(--text);
}</style>
</head>
<body>
  <div class="bg-orbs"></div>
  <div class="bg-grid"></div>

  <!-- Join screen -->
  <div class="join-screen" id="joinScreen">
    <div class="logo">🚀</div>
    <h1>no work people only 🚀</h1>
    <p>Jump into the group conversation.</p>
    <div class="status status-connecting" id="status"><i></i><span>Connecting…</span></div>
    <div class="join-form">
      <input type="text" id="username" placeholder="What's your name?" autocomplete="off" maxlength="24" />
      <button id="joinBtn">Join Chat</button>
    </div>
  </div>

  <!-- Chat screen -->
  <div class="app hidden" id="chatScreen">
    <div class="chat-panel">
      <header>
        <div class="group-avatar">🚀</div>
        <div class="group-meta">
          <h1>no work people only 🚀</h1>
          <div class="subtitle"><span class="dot"></span><span id="onlineCount">0</span> online</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" aria-label="More" title="More">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="date-divider">Today</div>
      </div>

      <div class="typing" id="typing">
        <span class="typing-dots"><i></i><i></i><i></i></span>
        <span class="typing-text"></span>
      </div>

      <div class="composer-wrap">
        <div class="reply-bar hidden" id="replyBar">
          <div class="reply-bar-content">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
            <div class="reply-bar-text">
              <span class="reply-bar-name" id="replyBarName"></span>
              <span class="reply-bar-msg" id="replyBarMsg"></span>
            </div>
          </div>
          <button class="reply-bar-close" id="replyBarClose" title="Cancel reply">✕</button>
        </div>
        <div class="composer">
          <div class="emoji-panel hidden" id="emojiPanel"></div>
          <div class="mention-dropdown hidden" id="mentionDropdown"></div>
          <div class="input-shell">
            <input id="input" type="text" placeholder="Message no work people only..." autocomplete="off" />
